name: Stock Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos ejecuciones intenten modificar state.json
# al mismo tiempo.
concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Check stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.run_monitor

      - name: Save state
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"

          git add data/state.json

          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "Update stock state"

          echo "Fetching latest remote state..."
          git fetch origin main

          echo "Rebasing state update..."
          git rebase origin/main

          echo "Pushing state..."
          git push origin HEAD:main
